  test_invalid_action_input:
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    env:
      PYTHON_VERSION: ""
      PYTHON_VERSION_FILE: .python-version
    steps:
      - name: Setup runner
        run: |
