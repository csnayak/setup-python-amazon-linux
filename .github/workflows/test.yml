name: Test

# Converted from setup-python-amazon-linux's composite action into a plain
# workflow: every job inlines the same "install python" steps instead of
# `uses: ./`. PYTHON_VERSION / PYTHON_VERSION_FILE (job env) stand in for the
# action's `python-version` / `python-version-file` inputs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_python_installation:
    strategy:
      fail-fast: false
      matrix:
        # This tests the amazon linux versions receiving standard support
        # Refer - https://endoflife.date/amazon-linux
        amazon-linux-version: [ 2, 2023 ]
        # This tests the lowest supported python version and the latest stable python version
        # Refer - https://devguide.python.org/versions/#status-of-python-versions
        python-version: [ 3.8.18, 3.12.0 ]
    runs-on: ubuntu-latest
    container: amazonlinux:${{ matrix.amazon-linux-version }}
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      PYTHON_VERSION_FILE: .python-version
    steps:
      - name: Setup runner
        run: |
          yum install -y git sudo tar gzip which

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Ensure system dependencies are installed
        run: |
          command -v tar &>/dev/null || sudo yum install -y tar
          command -v gzip &>/dev/null || sudo yum install -y gzip
          command -v which &>/dev/null || sudo yum install -y which

      - name: Install uv
        run: |
          installation_directory="${GITHUB_WORKSPACE}/.setup-python-amazon-linux/uv"
          echo "Installing uv.. installation_directory=${installation_directory}"
          uv_version="0.11.11"
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-installer.sh" | UV_UNMANAGED_INSTALL="${installation_directory}" bash --login
          echo "${installation_directory}" >> "${GITHUB_PATH}"

      - name: Find desired python version
        id: find-desired-python-version
        run: |
          desired_python_version=$(./find-desired-python-version.sh "${PYTHON_VERSION}" "${PYTHON_VERSION_FILE}")
          echo "desired_python_version=${desired_python_version}" | tee -a "${GITHUB_OUTPUT}"

      - name: Set installation directory
        id: set-installation-directory
        run: |
          desired_python_version="${{ steps.find-desired-python-version.outputs.desired_python_version }}"
          echo "installation_directory=${HOME}/.setup-python-amazon-linux/.python-versions/${desired_python_version}" | tee -a "${GITHUB_OUTPUT}"

      - name: Setup python
        id: setup-python
        run: |
          installation_directory="${{ steps.set-installation-directory.outputs.installation_directory }}"
          desired_python_version="${{ steps.find-desired-python-version.outputs.desired_python_version }}"
          uv venv --clear --python "${desired_python_version}" "${installation_directory}"

      - name: Add python to PATH
        run: |
          installation_directory="${{ steps.set-installation-directory.outputs.installation_directory }}"
          echo "${installation_directory}/bin" >> "${GITHUB_PATH}"
          echo "The following python binaries are now available in the PATH"
          ls "${installation_directory}/bin"

      - name: Install pip
        run: |
          installation_directory="${{ steps.set-installation-directory.outputs.installation_directory }}"
          python -m ensurepip --upgrade
          ln -sf "${installation_directory}/bin/pip3" "${installation_directory}/bin/pip"
          pip install --upgrade pip

      - name: Test installation
        run: |
          set -x

          which python3
          which python

          python3 --version
          python --version

          python3 --version 2>&1 | grep -F "${{ matrix.python-version }}"
          test "$(python3 -m pip --version)" = "$(pip3 --version)"

          python --version 2>&1 | grep -F "${{ matrix.python-version }}"
          test "$(python3 -m pip --version)" = "$(pip --version)"

  test_pip_installs:
    strategy:
      fail-fast: false
